<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رانيا… رنونه اللي مفيش حد زيها 🤍✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Tajawal:wght@300;400;500;700&family=Aref+Ruqaa:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(160deg, #0d0221 0%, #150637 20%, #1a0a42 35%, #1e1055 50%, #170d45 65%, #0f0830 80%, #0a0420 100%);
            min-height: 100vh;
            color: #e8dff5;
            overflow-x: hidden;
            position: relative;
            user-select: none;
        }

        /* ===== Sky Background ===== */
        .sky-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .sky-star {
            position: absolute;
            background: radial-gradient(circle, #fff 0%, transparent 70%);
            border-radius: 50%;
            animation: skyTwinkle var(--dur) ease-in-out infinite;
            animation-delay: var(--del);
            opacity: 0;
        }
        @keyframes skyTwinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: var(--peak); transform: scale(1.2); }
        }

        /* Shooting stars */
        .shooting-star {
            position: absolute;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent);
            border-radius: 2px;
            animation: shoot var(--dur) linear infinite;
            animation-delay: var(--del);
            opacity: 0;
        }
        @keyframes shoot {
            0% { opacity: 0; transform: translate(0, 0) rotate(-35deg); }
            5% { opacity: 1; }
            15% { opacity: 0; transform: translate(-300px, 200px) rotate(-35deg); }
            100% { opacity: 0; }
        }

        /* ===== Floating Particles ===== */
        .particles-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            animation: particleFloat var(--dur) ease-in-out infinite;
            animation-delay: var(--del);
            font-size: var(--size);
            opacity: 0;
        }
        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(20px) scale(0.5); }
            20% { opacity: 0.6; }
            80% { opacity: 0.4; }
            100% { opacity: 0; transform: translateY(-80px) scale(1.1); }
        }

        /* ===== Transition Burst ===== */
        .burst-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 50;
            pointer-events: none;
            overflow: hidden;
        }
        .burst-item {
            position: absolute;
            font-size: 20px;
            opacity: 0;
            animation: burstAnim 1.8s ease-out forwards;
        }
        @keyframes burstAnim {
            0% { opacity: 0; transform: translate(0, 0) scale(0.3) rotate(0deg); }
            20% { opacity: 1; }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.8) rotate(360deg); }
        }

        /* ===== Main Container ===== */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ===== Progress Bar ===== */
        .progress-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .progress-wrapper.visible { opacity: 1; }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #c084fc, #e879f9, #f0abfc, #c084fc);
            background-size: 200% 100%;
            animation: progressShine 3s linear infinite;
            border-radius: 0 2px 2px 0;
            transition: width 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.5);
        }
        @keyframes progressShine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ===== Title Screen ===== */
        .title-screen {
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        .title-screen.show { opacity: 1; }
        .title-screen.hide {
            opacity: 0;
            transform: translateY(-30px);
            transition: all 1s ease;
        }

        .title-ornament {
            font-size: 2rem;
            margin-bottom: 10px;
            animation: gentlePulse 3s ease-in-out infinite;
        }
        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .main-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: clamp(1.8rem, 5.5vw, 3.2rem);
            background: linear-gradient(135deg, #e0b0ff, #f0abfc, #fcd6ec, #f0abfc, #e0b0ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGradient 6s ease-in-out infinite;
            line-height: 1.8;
            margin-bottom: 8px;
        }
        @keyframes titleGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .title-sub {
            font-family: 'Amiri', serif;
            font-size: clamp(0.95rem, 2.5vw, 1.25rem);
            color: #c4b5d9;
            font-style: italic;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        /* ===== Buttons ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
        }
        .btn.show {
            opacity: 1;
            transform: translateY(0);
        }

        .btn-start {
            background: linear-gradient(135deg, #7c3aed, #a855f7, #c084fc);
            color: #fff;
            box-shadow: 0 4px 25px rgba(124, 58, 237, 0.4);
        }
        .btn-start:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 8px 35px rgba(124, 58, 237, 0.6);
        }

        .btn-continue {
            background: linear-gradient(135deg, #a855f7, #d946ef, #f0abfc);
            color: #fff;
            box-shadow: 0 4px 25px rgba(168, 85, 247, 0.35);
        }
        .btn-continue:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 8px 35px rgba(168, 85, 247, 0.55);
        }

        .btn-restart {
            background: linear-gradient(135deg, #6d28d9, #8b5cf6, #a78bfa);
            color: #fff;
            box-shadow: 0 4px 25px rgba(109, 40, 217, 0.4);
        }
        .btn-restart:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 8px 35px rgba(109, 40, 217, 0.6);
        }

        /* ===== Story Area ===== */
        .story-area {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .story-area.show {
            display: flex;
        }

        .story-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(192, 132, 252, 0.12);
            border-radius: 24px;
            padding: clamp(28px, 5vw, 50px);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        .story-card::before, .story-card::after {
            content: '';
            position: absolute;
            right: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, #c084fc, #e879f9, #c084fc, transparent);
        }
        .story-card::before { top: 0; }
        .story-card::after { bottom: 0; }

        .section-icon {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 6px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .section-icon.show { opacity: 1; }

        .section-heading {
            font-family: 'Aref Ruqaa', serif;
            font-size: clamp(1.3rem, 3.5vw, 1.8rem);
            color: #d8b4fe;
            text-align: center;
            margin-bottom: 22px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.8s ease;
        }
        .section-heading.show {
            opacity: 1;
            transform: translateY(0);
        }

        .story-text {
            font-family: 'Amiri', serif;
            font-size: clamp(1.05rem, 2.5vw, 1.25rem);
            line-height: 2.3;
            color: #e0d4ef;
            text-align: justify;
            min-height: 1em;
            position: relative;
        }
        .story-text.indent { text-indent: 2em; }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #c084fc;
            margin-right: 2px;
            vertical-align: middle;
            animation: cursorBlink 0.8s step-end infinite;
            box-shadow: 0 0 8px rgba(192, 132, 252, 0.6);
        }
        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Name highlight */
        .name-hl {
            color: #f0abfc;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(240, 171, 252, 0.4);
        }

        .quote-block {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.12), rgba(168, 85, 247, 0.05));
            border-right: 4px solid #a855f7;
            border-radius: 0 16px 16px 0;
            padding: 20px 24px;
            margin: 20px 0;
            font-family: 'Aref Ruqaa', serif;
            font-size: clamp(1.1rem, 2.8vw, 1.3rem);
            color: #e0b0ff;
            line-height: 2.1;
            text-align: center;
            text-indent: 0 !important;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 1s ease;
        }
        .quote-block.show {
            opacity: 1;
            transform: translateX(0);
        }

        .para-space { height: 18px; }

        .buttons-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            min-height: 60px;
        }

        /* ===== Final Message ===== */
        .final-message {
            text-align: center;
            opacity: 0;
            transform: scale(0.8);
            transition: all 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            margin-bottom: 20px;
        }
        .final-message.show {
            opacity: 1;
            transform: scale(1);
        }
        .final-big-text {
            font-family: 'Aref Ruqaa', serif;
            font-size: clamp(1.6rem, 5vw, 2.8rem);
            background: linear-gradient(135deg, #e0b0ff, #f9a8d4, #fde68a, #f9a8d4, #e0b0ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGradient 5s ease-in-out infinite;
            margin-bottom: 30px;
            line-height: 1.8;
        }
        .final-hearts {
            font-size: 2.5rem;
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
        }

        .section-content {
            opacity: 1;
            transition: opacity 0.8s ease;
        }
        .section-content.fade-out {
            opacity: 0;
        }

        @media (max-width: 600px) {
            .container { padding: 15px 12px; }
            .story-card { padding: 22px 18px; border-radius: 18px; }
            .btn { padding: 12px 28px; font-size: 1rem; }
            .quote-block { padding: 15px 16px; margin: 15px 0; }
            .buttons-area { gap: 8px; }
        }
    </style>
</head>
<body>

    <!-- Sky Background -->
    <div class="sky-bg" id="skyBg"></div>

    <!-- Floating Particles -->
    <div class="particles-container" id="particlesContainer"></div>

    <!-- Burst Effects Container -->
    <div class="burst-container" id="burstContainer"></div>

    <!-- Progress Bar -->
    <div class="progress-wrapper" id="progressWrapper">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Main Container -->
    <div class="container">

        <!-- Title Screen -->
        <div class="title-screen" id="titleScreen">
            <div class="title-ornament">✨ 🤍 ✨</div>
            <h1 class="main-title">رانيا… رنونه اللي مفيش حد زيها 🤍✨</h1>
            <p class="title-sub">حكاية أجمل بنوتة ممكن تشوفها في العالم … 🥰🤍🤍</p>
            <button class="btn btn-start" id="btnStart" onclick="startStory()">ابدأ الحكاية ✨</button>
        </div>

        <!-- Story Area -->
        <div class="story-area" id="storyArea">
            <div class="story-card" id="storyCard">
                <div class="section-content" id="sectionContent">
                    <div class="section-icon" id="sectionIcon"></div>
                    <div class="section-heading" id="sectionHeading"></div>
                    <div id="textContainer"></div>
                </div>
            </div>

            <div class="buttons-area" id="buttonsArea">
                <button class="btn btn-continue" id="btnPrev" onclick="prevSection()" style="display:none;">السابق ↩</button>
                <button class="btn btn-continue" id="btnContinue" onclick="nextSection()" style="display:none;">التالي 🤍</button>
            </div>
        </div>

        <!-- Final Message -->
        <div class="final-message" id="finalMessage" style="display:none;">
            <div class="final-big-text">مفيش حد زي رنونه 🤍✨</div>
            <div class="final-hearts">🤍 ✨ 🤍</div>
        </div>

    </div>

    <script>
    // ===================== CONFIG =====================
    const TYPE_SPEED = 28;        // ms per character
    const QUOTE_SPEED = 35;       // ms per character
    const BURST_COUNT = 18;       // particles per burst

    // ===================== STORY DATA =====================
    const sections = [
        {
            icon: '🤍',
            heading: 'حكاية رنونة',
            paragraphs: [
                { text: 'في يوم 3 مايو 2007، اتولدت رانيا، البنت اللي يمكن اسمها عادي عند ناس كتير، بس لما تعرفها وتبص لتفاصيلها تكتشف إن مفيش فيها حاجة عادية. وأنا بحب أناديها رنونة، لأن الاسم ده لايق عليها أوي.', indent: true },
                { text: 'رنونة بنت بسيطة بطبعها، وده أكتر شيء مميز فيها. مش بتحاول تلفت الانتباه، ومش محتاجة تتصنع عشان الناس تاخد بالها منها. هي بس بتكون على طبيعتها، ومع ذلك وجودها لوحده بيخلي المكان أهدى وأحلى.', indent: true }
            ]
        },
        {
            icon: '🌸',
            heading: 'جمالها اللي بيتشاف في التفاصيل',
            paragraphs: [
                { text: 'أنا بجد مشوفتش في جمالها زيه خالص. مش قصدي ملامح حلوة وخلاص، لأن جمال رنونة أكبر من كده. في عينيها براءة، وفي ابتسامتها راحة، وفي طريقتها وهي بتتكلم حاجة تخليك تركز معاها من غير ما تحس.', indent: true },
                { text: 'والأجمل إن كل ده بيظهر وهي عادية جدًا. ممكن تكون قاعدة بتتكلم أو ساكتة أو بتضحك على حاجة بسيطة، وبرضه تلاقي فيها حاجة بتشدك. كأن جمالها مش محتاج مناسبة عشان يظهر.', indent: true }
            ]
        },
        {
            icon: '✨',
            heading: 'موقف صغير بس فاكره',
            paragraphs: [
                { text: 'فاكر مرة كانت قاعدة وسط ناس وبتسمع الكلام من غير ما تتدخل كتير. كانت هادية وعلى طبيعتها، ولما حد قال حاجة ضحكت فجأة. ضحكتها وقتها كانت بسيطة جدًا، بس كانت كفاية تغيّر جو القعدة كلها.', indent: true },
                { text: 'في اللحظة دي حسيت إن دي رنونة اللي بتخلي الحاجات البسيطة ليها معنى. مش محتاجة تعمل حاجة كبيرة، مجرد ابتسامة أو ضحكة منها ممكن تخلي اللي حواليها يبتسموا معاها.', indent: true }
            ],
            quote: 'أجمل حاجة في رنونة إنها مش بتحاول تبقى مميزة... هي مميزة وهي على طبيعتها.'
        },
        {
            icon: '🤍',
            heading: 'رنونة زي ما هي',
            paragraphs: [
                { text: 'يمكن أجمل حاجة فيها إنها مش واخدة بالها من كل ده. شايفة نفسها بنت عادية، مع إن عفويتها وبساطتها هما أصلًا أكتر حاجات مخليينها مختلفة.', indent: true },
                { text: 'وفي وقت بقى فيه ناس كتير بتحاول تظهر بصورة معينة، رنونة لسه محتفظة بالحاجة اللي بتخليها حلوة بجد: إنها نفسها، من غير فلاتر ولا تصنع ولا محاولة إنها تبقى شبه حد.', indent: true }
            ]
        },
        {
            icon: '🌙',
            heading: 'ساندريلا زماننا',
            paragraphs: [
                { text: 'وعشان كده أنا بشوف رنونة كأنها ساندريلا، بس مش ساندريلا بتاعة القصور والعربيات السحرية. دي ساندريلا من وسط حياتنا العادية، بنت بسيطة، جميلة، وضحكتها قادرة تخلي يوم تقيل يبقى أخف.', indent: true },
                { text: 'ولو الحكايات القديمة كانت بتقول إن الأميرة بتتميز عن غيرها، فرَنونة مميزة من غير ما تحتاج لقب أميرة أصلًا. يكفي إنها رنونة، والباقي كله تفاصيل حلوة اتجمعت فيها.', indent: true }
            ],
            quote: 'أنا مشوفتش في جمال رنونة زيه خالص... ويمكن أجمل حاجة فيها إنها مش عارفة هي جميلة قد إيه. 🤍'
        },
        {
            icon: '💫',
            heading: 'وفي الآخر...',
            isFinal: true,
            paragraphs: [
                { text: 'لو فضلت أتكلم عن رنونة، هفضل كل شوية أفتكر تفصيلة جديدة وأقول دي كمان لازم تتحكي. عشان هي مش مجرد شكل حلو، دي شخصية بتخلي التفاصيل الصغيرة ليها طعم مختلف.', indent: true },
                { text: 'وفي الآخر مهما اتقال عنها، هتفضل رنونة هي رنونة... بنت بسيطة من مواليد 3 مايو 2007، بس بالنسبة لي مفيش حد شبهها ولا جمالها بيتكرر.', indent: true }
            ],
            finalText: 'رانيا... أو رنونة 🤍<br>بنت بسيطة أوي، بس مفيش فيها حاجة عادية.<br>ومهما اتكلمت عنها، هفضل شايفها أجمل من أي وصف. ✨'
        }
    ];

    // ===================== STATE =====================
    let currentSection = 0;
    let isTyping = false;
    let typeTimeout = null;
    let activeResolve = null;
    let activeJobs = [];
    let currentCursor = null;

    // ===================== INIT =====================
    document.addEventListener('DOMContentLoaded', () => {
        createSkyStars();
        createFloatingParticles();
        setTimeout(() => {
            document.getElementById('titleScreen').classList.add('show');
            setTimeout(() => {
                document.getElementById('btnStart').classList.add('show');
            }, 800);
        }, 500);
    });

    // ===================== SKY STARS =====================
    function createSkyStars() {
        const container = document.getElementById('skyBg');
        for (let i = 0; i < 90; i++) {
            const star = document.createElement('div');
            star.className = 'sky-star';
            const size = 1 + Math.random() * 3;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
            star.style.setProperty('--del', (Math.random() * 5) + 's');
            star.style.setProperty('--peak', (0.4 + Math.random() * 0.6).toString());
            container.appendChild(star);
        }
        for (let i = 0; i < 3; i++) {
            const s = document.createElement('div');
            s.className = 'shooting-star';
            s.style.top = (5 + Math.random() * 40) + '%';
            s.style.left = (30 + Math.random() * 60) + '%';
            s.style.setProperty('--dur', (6 + Math.random() * 8) + 's');
            s.style.setProperty('--del', (i * 7 + Math.random() * 4) + 's');
            container.appendChild(s);
        }
    }

    // ===================== FLOATING PARTICLES =====================
    function createFloatingParticles() {
        const container = document.getElementById('particlesContainer');
        const symbols = ['🤍', '✨', '💜', '🩷', '🌸', '⭐'];
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('span');
            p.className = 'particle';
            p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            p.style.top = (20 + Math.random() * 70) + '%';
            p.style.left = Math.random() * 100 + '%';
            p.style.setProperty('--dur', (6 + Math.random() * 10) + 's');
            p.style.setProperty('--del', (Math.random() * 8) + 's');
            p.style.setProperty('--size', (10 + Math.random() * 16) + 'px');
            container.appendChild(p);
        }
    }

    // ===================== BURST EFFECT =====================
    function triggerBurst() {
        const container = document.getElementById('burstContainer');
        const symbols = ['✨', '🤍', '⭐', '💫', '💜', '🌸', '🩷', '🌟'];
        for (let i = 0; i < BURST_COUNT; i++) {
            const item = document.createElement('span');
            item.className = 'burst-item';
            item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            item.style.left = (40 + Math.random() * 20) + '%';
            item.style.top = (30 + Math.random() * 20) + '%';
            const angle = Math.random() * Math.PI * 2;
            const dist = 80 + Math.random() * 200;
            item.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
            item.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
            item.style.animationDelay = (Math.random() * 0.3) + 's';
            container.appendChild(item);
            setTimeout(() => item.remove(), 2000);
        }
    }

    // ===================== PROGRESS =====================
    function updateProgress() {
        const total = sections.length;
        const pct = ((currentSection + 1) / total) * 100;
        document.getElementById('progressBar').style.width = pct + '%';
    }

    // ===================== TEXT HIGHLIGHTING =====================
    function processText(text) {
        return text.replace(/(رانيا|رنونة|رنونه)/g, '<span class="name-hl">$1</span>');
    }

    // ===================== TYPEWRITER ENGINE =====================
    function typeText(element, html, speed, indent) {
        return new Promise((resolve) => {
            isTyping = true;
            activeResolve = resolve;
            activeJobs = [];

            if (indent) element.classList.add('indent');
            element.innerHTML = '';

            const temp = document.createElement('div');
            temp.innerHTML = html;

            prepareDOM(temp, element, activeJobs);

            currentCursor = document.createElement('span');
            currentCursor.className = 'cursor';
            element.appendChild(currentCursor);

            let jobIdx = 0;
            let charIdx = 0;

            function tick() {
                if (!isTyping) return;

                if (jobIdx >= activeJobs.length) {
                    typeTimeout = setTimeout(() => {
                        if (currentCursor) currentCursor.remove();
                        finishTyping();
                    }, 300);
                    return;
                }

                const job = activeJobs[jobIdx];
                if (charIdx < job.text.length) {
                    job.node.nodeValue += job.text[charIdx];
                    charIdx++;
                    if (currentCursor) element.appendChild(currentCursor);
                    typeTimeout = setTimeout(tick, speed);
                } else {
                    jobIdx++;
                    charIdx = 0;
                    tick();
                }
            }

            tick();
        });
    }

    function prepareDOM(sourceParent, targetParent, jobs) {
        for (const child of sourceParent.childNodes) {
            if (child.nodeType === Node.TEXT_NODE) {
                if (child.textContent.length > 0) {
                    const textNode = document.createTextNode('');
                    targetParent.appendChild(textNode);
                    jobs.push({ node: textNode, text: child.textContent });
                }
            } else if (child.nodeType === Node.ELEMENT_NODE) {
                const newElem = child.cloneNode(false);
                targetParent.appendChild(newElem);
                prepareDOM(child, newElem, jobs);
            }
        }
    }

    function finishTyping() {
        if (typeTimeout) clearTimeout(typeTimeout);
        
        if (activeJobs && activeJobs.length > 0) {
            activeJobs.forEach(job => {
                job.node.nodeValue = job.text;
            });
        }
        if (currentCursor) {
            currentCursor.remove();
            currentCursor = null;
        }

        isTyping = false;
        const res = activeResolve;
        activeResolve = null;
        activeJobs = [];
        if (res) res();
    }

    function skipCurrentTyping() {
        if (isTyping) {
            finishTyping();
        }
    }

    // ===================== STORY FLOW =====================
    function startStory() {
        const titleScreen = document.getElementById('titleScreen');
        titleScreen.classList.add('hide');

        setTimeout(() => {
            titleScreen.style.display = 'none';
            const storyArea = document.getElementById('storyArea');
            storyArea.classList.add('show');
            document.getElementById('progressWrapper').classList.add('visible');
            showSection(0);
        }, 1000);
    }

    async function showSection(idx) {
        currentSection = idx;
        const section = sections[idx];
        const content = document.getElementById('sectionContent');
        const textContainer = document.getElementById('textContainer');
        const sectionIcon = document.getElementById('sectionIcon');
        const sectionHeading = document.getElementById('sectionHeading');
        const btnPrev = document.getElementById('btnPrev');
        const btnContinue = document.getElementById('btnContinue');

        btnPrev.style.display = 'none';
        btnPrev.classList.remove('show');
        btnContinue.style.display = 'none';
        btnContinue.classList.remove('show');

        content.classList.add('fade-out');
        await sleep(500);

        textContainer.innerHTML = '';
        sectionIcon.textContent = section.icon;
        sectionIcon.classList.remove('show');
        sectionHeading.textContent = section.heading;
        sectionHeading.classList.remove('show');

        content.classList.remove('fade-out');
        await sleep(200);
        sectionIcon.classList.add('show');
        await sleep(350);

        sectionHeading.classList.add('show');
        await sleep(450);

        // Type Paragraphs
        for (let i = 0; i < section.paragraphs.length; i++) {
            if (i > 0) {
                const spacer = document.createElement('div');
                spacer.className = 'para-space';
                textContainer.appendChild(spacer);
            }

            const p = document.createElement('div');
            p.className = 'story-text';
            textContainer.appendChild(p);

            const processedHTML = processText(section.paragraphs[i].text);
            await typeText(p, processedHTML, TYPE_SPEED, section.paragraphs[i].indent);
            await sleep(250);
        }

        // Type Quote if exists
        if (section.quote) {
            const spacer = document.createElement('div');
            spacer.className = 'para-space';
            textContainer.appendChild(spacer);

            const q = document.createElement('div');
            q.className = 'quote-block story-text';
            textContainer.appendChild(q);

            const processedQuote = processText(section.quote);
            await sleep(250);
            q.classList.add('show');
            await typeText(q, processedQuote, QUOTE_SPEED, false);
            await sleep(250);
        }

        // Final text if exists
        if (section.finalText) {
            const spacer = document.createElement('div');
            spacer.className = 'para-space';
            textContainer.appendChild(spacer);

            const ft = document.createElement('div');
            ft.className = 'story-text';
            ft.style.fontFamily = '"Aref Ruqaa", serif';
            ft.style.fontSize = 'clamp(1.15rem, 3vw, 1.4rem)';
            ft.style.color = '#d8b4fe';
            ft.style.textAlign = 'center';
            ft.style.fontWeight = '700';
            ft.style.textShadow = '0 0 30px rgba(124, 58, 237, 0.2)';
            ft.style.marginTop = '20px';
            ft.style.lineHeight = '2.4';
            textContainer.appendChild(ft);

            const processedFinal = processText(section.finalText.replace(/<br>/g, '\n')).replace(/\n/g, '<br>');
            await sleep(350);
            await typeText(ft, processedFinal, QUOTE_SPEED, false);
            await sleep(400);
        }

        updateProgress();

        if (section.isFinal) {
            await sleep(300);
            showFinalMessage();
            return;
        }

        btnPrev.style.display = currentSection > 0 ? 'inline-flex' : 'none';
        btnContinue.style.display = 'inline-flex';

        await sleep(100);
        if (currentSection > 0) btnPrev.classList.add('show');
        btnContinue.classList.add('show');
    }

    function prevSection() {
        if (isTyping) {
            skipCurrentTyping();
            return;
        }
        if (currentSection > 0) {
            currentSection--;
            triggerBurst();
            showSection(currentSection);
        }
    }

    function nextSection() {
        if (isTyping) {
            skipCurrentTyping();
            return;
        }
        if (currentSection < sections.length - 1) {
            currentSection++;
            triggerBurst();
            showSection(currentSection);
        }
    }

    // ===================== FINAL MESSAGE =====================
    async function showFinalMessage() {
        document.getElementById('btnPrev').style.display = 'none';
        document.getElementById('btnContinue').style.display = 'none';

        document.getElementById('progressBar').style.width = '100%';

        const finalMsg = document.getElementById('finalMessage');
        finalMsg.style.display = 'block';

        await sleep(300);
        triggerBurst();
        await sleep(400);
        finalMsg.classList.add('show');

        await sleep(1200);
        const buttonsArea = document.getElementById('buttonsArea');
        const restartBtn = document.createElement('button');
        restartBtn.className = 'btn btn-restart';
        restartBtn.textContent = 'إعادة الحكاية 🔄';
        restartBtn.onclick = restartStory;
        buttonsArea.appendChild(restartBtn);
        await sleep(200);
        restartBtn.classList.add('show');

        setTimeout(() => triggerBurst(), 1500);
    }

    // ===================== RESTART =====================
    async function restartStory() {
        currentSection = 0;
        isTyping = false;

        const buttonsArea = document.getElementById('buttonsArea');
        buttonsArea.innerHTML = '';

        const btnPrev = document.createElement('button');
        btnPrev.className = 'btn btn-continue';
        btnPrev.id = 'btnPrev';
        btnPrev.textContent = 'السابق ↩';
        btnPrev.style.display = 'none';
        btnPrev.onclick = prevSection;
        buttonsArea.appendChild(btnPrev);

        const btnContinue = document.createElement('button');
        btnContinue.className = 'btn btn-continue';
        btnContinue.id = 'btnContinue';
        btnContinue.textContent = 'التالي 🤍';
        btnContinue.style.display = 'none';
        btnContinue.onclick = nextSection;
        buttonsArea.appendChild(btnContinue);

        const finalMsg = document.getElementById('finalMessage');
        finalMsg.classList.remove('show');
        await sleep(500);
        finalMsg.style.display = 'none';

        document.getElementById('progressBar').style.width = '0%';

        triggerBurst();
        await sleep(300);
        showSection(0);
    }

    // ===================== HELPERS =====================
    function sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
    }

    // Skip typing instantly on screen tap
    document.addEventListener('click', (e) => {
        if (isTyping && !e.target.closest('.btn')) {
            skipCurrentTyping();
        }
    });
    </script>
</body>
